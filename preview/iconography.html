<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--bg-1); }
  body { padding: 24px; font-family: var(--font-body); }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 16px; color: var(--fg-1); }
  .item { display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center; }
  .tile {
    width: 48px; height: 48px;
    background: linear-gradient(140deg, #1A2238, #0A0E1A);
    border: 1px solid var(--line-1);
    border-radius: 12px;
    display: grid; place-items: center;
    color: var(--accent);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .name { font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--fg-2); }
  svg { width: 22px; height: 22px; stroke-width: 1.6; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>

  <div class="item"><div class="tile"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-5"/></svg></div><div class="name">Trends</div></div>

</html>
