<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--bg-1); }
  body { padding: 24px; font-family: var(--font-body); color: var(--fg-1); display: flex; gap: 18px; align-items: center; }
  .item { display: flex; flex-direction: column; gap: 8px; align-items: center; flex: 1; }
  .demo { width: 100px; height: 80px; background: linear-gradient(140deg, #1A2238, #10172A); border: 1px solid var(--line-1); }
  .lbl { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.16em; color: var(--fg-2); }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--fg-0); }
</style>
</head>
<body>
  <div class="item"><div class="demo" style="border-radius:6px"></div><div class="lbl">r-sm</div><div class="px">6</div></div>
  <div class="item"><div class="demo" style="border-radius:12px"></div><div class="lbl">r-md</div><div class="px">12</div></div>
  <div class="item"><div class="demo" style="border-radius:18px"></div><div class="lbl">r-lg</div><div class="px">18</div></div>
  <div class="item"><div class="demo" style="border-radius:28px"></div><div class="lbl">r-xl</div><div class="px">28</div></div>
  <div class="item"><div class="demo" style="border-radius:999px; width:140px; height:48px"></div><div class="lbl">r-pill</div><div class="px">999</div></div>
</body>
</html>
