<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--bg-1); }
  body { padding: 24px; font-family: var(--font-body); }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
  .sw { display: flex; flex-direction: column; gap: 8px; }
  .chip {
    aspect-ratio: 1; border-radius: var(--r-md);
    border: 1px solid rgba(255,255,255,0.04);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 6px 20px -10px rgba(0,0,0,0.6);
  }
  .chip.glow { box-shadow: var(--shadow-glow); }
  .lbl { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.16em; color: var(--fg-2); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--fg-1); }
  .name { font-size: 12px; color: var(--fg-0); margin-top: -2px; }
  .header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; }
  .h-ttl { font-family: var(--font-display); color: var(--fg-0); font-size: 18px; font-weight: 600; }
  .h-tag { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.16em; color: var(--accent); }
</style>
</head>
<body>
<div class="header">
  <div class="h-ttl">Foreground &amp; Accents</div>
  <div class="h-tag">Live circuit · Cyan accent</div>
</div>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#EAF1FF"></div><div class="lbl">fg-0</div><div class="name">Platinum</div><div class="hex">#EAF1FF</div></div>
  <div class="sw"><div class="chip" style="background:#B8C4DB"></div><div class="lbl">fg-1</div><div class="name">Silver</div><div class="hex">#B8C4DB</div></div>
  <div class="sw"><div class="chip" style="background:#7A88A6"></div><div class="lbl">fg-2</div><div class="name">Silver dim</div><div class="hex">#7A88A6</div></div>
  <div class="sw"><div class="chip glow" style="background:#5EE7FF"></div><div class="lbl">accent</div><div class="name">Cyan circuit</div><div class="hex">#5EE7FF</div></div>
  <div class="sw"><div class="chip" style="background:#7AA0FF"></div><div class="lbl">accent-2</div><div class="name">Steel blue</div><div class="hex">#7AA0FF</div></div>
  <div class="sw"><div class="chip" style="background:#3DDC97"></div><div class="lbl">ok</div><div class="name">Success</div><div class="hex">#3DDC97</div></div>
</div>
</body>
</html>
