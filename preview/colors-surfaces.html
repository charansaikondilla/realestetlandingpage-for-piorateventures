<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--bg-1); }
  body { padding: 24px; font-family: var(--font-body); }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 14px; }
  .sw { display: flex; flex-direction: column; gap: 8px; }
  .chip {
    aspect-ratio: 1; border-radius: var(--r-md);
    border: 1px solid rgba(255,255,255,0.04);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 6px 20px -10px rgba(0,0,0,0.6);
  }
  .lbl { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.16em; color: var(--fg-2); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--fg-1); }
  .name { font-size: 12px; color: var(--fg-0); margin-top: -2px; }
  .header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; }
  .h-ttl { font-family: var(--font-display); color: var(--fg-0); font-size: 18px; font-weight: 600; }
  .h-tag { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.16em; color: var(--accent); }
</style>
</head>
<body>
<div class="header">
  <div class="h-ttl">Surfaces &amp; Lines</div>
  <div class="h-tag">Cool · Dark · Metallic</div>
</div>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#05070D"></div><div class="lbl">bg-0</div><div class="name">Obsidian</div><div class="hex">#05070D</div></div>
  <div class="sw"><div class="chip" style="background:#0A0E1A"></div><div class="lbl">bg-1</div><div class="name">Navy ink</div><div class="hex">#0A0E1A</div></div>
  <div class="sw"><div class="chip" style="background:#10172A"></div><div class="lbl">bg-2</div><div class="name">Navy raised</div><div class="hex">#10172A</div></div>
  <div class="sw"><div class="chip" style="background:#1A2238"></div><div class="lbl">bg-3</div><div class="name">Gunmetal</div><div class="hex">#1A2238</div></div>
  <div class="sw"><div class="chip" style="background:#2A3550"></div><div class="lbl">line-1</div><div class="name">Steel</div><div class="hex">#2A3550</div></div>
  <div class="sw"><div class="chip" style="background:#3D4D70"></div><div class="lbl">line-2</div><div class="name">Steel bright</div><div class="hex">#3D4D70</div></div>
  <div class="sw"><div class="chip" style="background:#EAF1FF"></div><div class="lbl">bg-inv</div><div class="name">Platinum</div><div class="hex">#EAF1FF</div></div>
</div>
</body>
</html>
