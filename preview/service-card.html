<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--bg-0); }
  body { padding: 28px; font-family: var(--font-body); }
  .card {
    background: linear-gradient(180deg, rgba(26,34,56,0.7) 0%, rgba(16,23,42,0.5) 100%);
    border: 1px solid var(--line-1);
    border-radius: 18px;
    padding: 24px;
    box-shadow: var(--shadow-card);
    position: relative;
    overflow: hidden;
    max-width: 380px;
  }
  .card::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(120% 60% at 0% 0%, rgba(94,231,255,0.08), transparent 50%);
    pointer-events: none;
  }
  .icon-tile {
    width: 52px; height: 52px;
    background: linear-gradient(140deg, #1A2238, #0A0E1A);
    border: 1px solid var(--line-1);
    border-radius: 12px;
    display: grid; place-items: center;
    color: var(--accent);
    margin-bottom: 18px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .eyebrow { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.16em; color: var(--accent); margin-bottom: 10px; }
  h3 { font-family: var(--font-display); color: var(--fg-0); font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; margin: 0 0 10px; }
  p { color: var(--fg-1); font-size: 14px; line-height: 1.55; margin: 0; }
  .outcome {
    margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--line-1);
    display: flex; align-items: center; gap: 10px;
    color: var(--fg-2); font-size: 12px;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 12px var(--ok); }
</style>
</head>
<body>
  <div class="card">
    <div class="icon-tile">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.37 1.9.72 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0122 16.92z"/>
      </svg>
    </div>
    <div class="eyebrow">Service · 01</div>
    <h3>AI Voice Closers™</h3>
    <p>24/7 AI voice agents that qualify and follow up with leads automatically — instant response, multilingual, CRM-integrated.</p>
    <div class="outcome"><span class="dot"></span> Never miss a high-intent property lead again.</div>
  </div>
</body>
</html>
