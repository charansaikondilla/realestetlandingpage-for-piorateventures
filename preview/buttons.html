<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--bg-0); }
  body { padding: 32px; font-family: var(--font-body); display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .btn {
    font-family: var(--font-body); font-weight: 600; font-size: 15px;
    border: 0; cursor: pointer; padding: 0 22px; height: 44px;
    border-radius: 10px; display: inline-flex; align-items: center; gap: 10px;
    transition: all 240ms cubic-bezier(0.2,0.8,0.2,1); letter-spacing: -0.005em;
  }
  .primary {
    background: linear-gradient(180deg, #6BEFFF, #2EB8D9);
    color: #02121A;
    box-shadow: 0 0 0 1px rgba(94,231,255,0.4), 0 0 40px -8px rgba(94,231,255,0.5), inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .secondary {
    background: rgba(16,23,42,0.6); color: var(--fg-0);
    box-shadow: inset 0 0 0 1px var(--line-1), inset 0 1px 0 rgba(255,255,255,0.04);
    backdrop-filter: blur(12px);
  }
  .ghost { background: transparent; color: var(--fg-1); box-shadow: inset 0 0 0 1px transparent; }
  .ghost:hover { color: var(--fg-0); box-shadow: inset 0 0 0 1px var(--line-1); }
  .pill { border-radius: 999px; }
  .arrow { width: 14px; height: 14px; }
  .lbl { width: 100%; font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.16em; color: var(--fg-2); margin-top: 6px; }
</style>
</head>
<body>
  <button class="btn primary">Book a Free Strategy Call
    <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
  </button>
  <button class="btn secondary">See How Automation Works</button>
  <button class="btn primary pill">Get Started</button>
  <button class="btn ghost">Sign in</button>
  <div class="lbl">btn primary · btn secondary · btn pill · btn ghost · 44px height · 10px radius</div>
</body>
</html>
