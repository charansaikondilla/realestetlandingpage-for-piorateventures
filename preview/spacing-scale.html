<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--bg-1); }
  body { padding: 28px; font-family: var(--font-body); color: var(--fg-1); }
  .row { display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap; }
  .stack { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .lbl { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.16em; color: var(--fg-2); }
  .bar { background: linear-gradient(180deg, rgba(94,231,255,0.12), rgba(94,231,255,0.06)); border: 1px solid rgba(94,231,255,0.25); border-radius: 4px; height: 24px; }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--fg-1); }
</style>
</head>
<body>
<div class="row">
  <div class="stack"><div class="bar" style="width:4px"></div><div class="lbl">s-1</div><div class="px">4</div></div>
  <div class="stack"><div class="bar" style="width:8px"></div><div class="lbl">s-2</div><div class="px">8</div></div>
  <div class="stack"><div class="bar" style="width:12px"></div><div class="lbl">s-3</div><div class="px">12</div></div>
  <div class="stack"><div class="bar" style="width:16px"></div><div class="lbl">s-4</div><div class="px">16</div></div>
  <div class="stack"><div class="bar" style="width:24px"></div><div class="lbl">s-5</div><div class="px">24</div></div>
  <div class="stack"><div class="bar" style="width:32px"></div><div class="lbl">s-6</div><div class="px">32</div></div>
  <div class="stack"><div class="bar" style="width:48px"></div><div class="lbl">s-7</div><div class="px">48</div></div>
  <div class="stack"><div class="bar" style="width:64px"></div><div class="lbl">s-8</div><div class="px">64</div></div>
  <div class="stack"><div class="bar" style="width:96px"></div><div class="lbl">s-9</div><div class="px">96</div></div>
  <div class="stack"><div class="bar" style="width:128px"></div><div class="lbl">s-10</div><div class="px">128</div></div>
</div>
</body>
</html>
